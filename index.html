<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bog'cha hujjatlari</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF9;
    --card:#FFFFFF;
    --ink:#17181A;
    --ink-soft:#8A8D91;
    --border:#EEEEEC;

    --c-tayyorlov:#F3A79C;
    --c-katta:#9CBDEC;
    --c-orta:#F0CE84;
    --c-kichik:#9BD9BC;

    --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 12px 28px rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:36px;
  }
  button{font-family:inherit; cursor:pointer;}
  a{text-decoration:none; color:inherit;}

  /* ---------- Header ---------- */
  .hero{
    padding:40px 24px 8px;
    max-width:520px;
    margin:0 auto;
  }
  h1{
    font-size:clamp(30px,8vw,36px);
    font-weight:800;
    line-height:1.22;
    margin:0 0 10px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  .hero p{
    color:#5B5E63;
    font-size:16.5px;
    line-height:1.55;
    margin:0;
    font-weight:600;
  }

  /* ---------- Grid ---------- */
  .grid{
    max-width:520px; margin:24px auto 0; padding:0 24px;
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .card{
    border:none; border-radius:20px;
    padding:22px 16px;
    display:flex; flex-direction:column; align-items:flex-start; gap:26px;
    min-height:138px;
    color:var(--ink);
    text-align:left;
    position:relative;
    overflow:hidden;
    transition:transform .12s ease;
  }
  .card:active{transform:scale(0.96);}

  .card[data-group="tayyorlov"]{background:var(--c-tayyorlov);}
  .card[data-group="katta"]{background:var(--c-katta);}
  .card[data-group="orta"]{background:var(--c-orta);}
  .card[data-group="kichik"]{background:var(--c-kichik);}

  .card-emoji{font-size:28px; line-height:1;}
  .card-label{
    font-size:18px; font-weight:800; line-height:1.25;
    color:var(--ink);
  }
  .card-arrow{
    position:absolute; top:18px; right:16px;
    width:28px; height:28px; border-radius:50%;
    background:rgba(23,24,26,0.14);
    display:flex; align-items:center; justify-content:center;
  }
  .card-arrow svg{width:14px; height:14px;}

  /* ---------- Footnote ---------- */
  .footnote{
    max-width:520px; margin:22px auto 0; padding:0 24px;
  }
  .footnote-inner{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px 18px;
    display:flex; align-items:center; gap:12px;
  }
  .footnote-icon{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:var(--bg); display:flex; align-items:center; justify-content:center;
    font-size:15px;
  }
  .footnote-text{
    font-size:13.5px; color:#6B6E73; line-height:1.5; font-weight:600;
  }

  footer{
    max-width:520px; margin:28px auto 0; padding:0 24px;
    text-align:center; font-size:11.5px; color:var(--ink-soft); font-weight:500;
  }

  /* ---------- Toast (tap feedback) ---------- */
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
    padding:12px 20px; border-radius:999px;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<div class="hero">
  <h1>O'z guruhingizni tanlang</h1>
  <p>Bosing — kanalga to'g'ridan-to'g'ri o'tasiz.</p>
</div>

<div class="grid">
  <a class="card" data-group="tayyorlov" href="https://t.me/Tayyorlov_guruh_DMTT" target="_blank" rel="noopener">
    <span class="card-arrow"><svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="#17181A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="card-emoji">🎒</span>
    <span class="card-label">Tayyorlov<br>guruhi</span>
  </a>

  <a class="card" data-group="katta" href="https://t.me/Katta_guruh_DMTT" target="_blank" rel="noopener">
    <span class="card-arrow"><svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="#17181A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="card-emoji">🧩</span>
    <span class="card-label">Katta<br>guruh</span>
  </a>

  <a class="card" data-group="orta" href="https://t.me/Orta_guruh_DMTT" target="_blank" rel="noopener">
    <span class="card-arrow"><svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="#17181A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="card-emoji">🖍️</span>
    <span class="card-label">O'rta<br>guruh</span>
  </a>

  <a class="card" data-group="kichik" href="https://t.me/Kichik_guruh_DMTT" target="_blank" rel="noopener">
    <span class="card-arrow"><svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="#17181A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="card-emoji">🧸</span>
    <span class="card-label">Kichik<br>guruh</span>
  </a>
</div>

<div class="footnote">
  <div class="footnote-inner">
    <div class="footnote-icon">📄</div>
    <div class="footnote-text">Hujjatlar bo'limi tez orada shu yerga qo'shiladi.</div>
  </div>
</div>

<footer>Bog'cha hujjatlari · Ichki portal</footer>

<div class="toast" id="toast">Kanalga o'tilmoqda...</div>

<script>
(function(){
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
  }

  const toast = document.getElementById('toast');
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1400);
    });
  });
})();
</script>

</body>
</html>
