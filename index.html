// ---------- Shared UI ----------
function TopBar({ onBack, title, sub, themeMode, onToggleTheme, onNotify }) {
  useEffect(() => {
    if (!tg || !tg.BackButton) return;
    if (onBack) { tg.BackButton.show(); tg.BackButton.offClick(); tg.BackButton.onClick(onBack); }
    else tg.BackButton.hide();
  }, [onBack]);

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "18px 20px 6px" }}>
      {onBack && (
        <button onClick={() => { haptic('light'); onBack(); }} style={iconBtnStyle()}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="var(--ink)" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      )}
      <div style={{ flex: 1, minWidth: 0 }}>
        {title && <div style={{ fontFamily: "var(--font-head)", fontWeight: 700, fontSize: 18, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{title}</div>}
        {sub && <div style={{ fontSize: 12, color: "var(--ink-soft)", fontWeight: 600 }}>{sub}</div>}
      </div>
      {!onBack && <img src={LOGO_SRC} alt="" style={{ width: 30, height: 30, borderRadius: 9, objectFit: "cover" }} />}
      <button onClick={() => { haptic('light'); onToggleTheme(); }} style={iconBtnStyle()}>
        {themeMode === "dark" ? "☀️" : "🌙"}
      </button>
    </div>
  );
}

function iconBtnStyle(){
  return { background: "var(--card)", border: "1px solid var(--border)", borderRadius: 10, width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, boxShadow: "var(--shadow)" };
}

function Sheet({ children, onClose }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "var(--overlay)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }}>
      <div onClick={(e) => e.stopPropagation()} className="fade" style={{ background: "var(--bg)", width: "100%", maxWidth: 520, borderRadius: "22px 22px 0 0", padding: "20px 20px 28px", maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ width: 36, height: 4, borderRadius: 2, background: "var(--border)", margin: "0 auto 16px" }} />
        {children}
      </div>
    </div>
  );
}

function Toast({ text }) {
  if (!text) return null;
  return (
    <div style={{ position: "fixed", left: "50%", bottom: 24, transform: "translateX(-50%)", background: "var(--ink)", color: "var(--bg)", fontSize: 13.5, fontWeight: 700, padding: "12px 20px", borderRadius: 999, boxShadow: "var(--shadow)", zIndex: 60, maxWidth: "88vw", textAlign: "center" }}>
      {text}
    </div>
  );
}

// ---------- Order Modal ----------
function OrderModal({ context, onClose, onSubmitted }) {
  const [text, setText] = useState("");
  const [phone, setPhone] = useState("");
  const [deadline, setDeadline] = useState("");
  const [sending, setSending] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  const item = context.item || null;

  const submit = async () => {
    if (!item && !text.trim()) { setErrorMsg("Iltimos, nima kerakligini yozing"); haptic('error'); return; }
    if (!phone.trim()) { setErrorMsg("Iltimos, telefon raqamingizni kiriting"); haptic('error'); return; }
    setErrorMsg("");
    setSending(true);

    const payload = item
      ? { type: "buyurtma_mahsulot", group: context.group, group_name: GROUP_INFO[context.group].name, category: context.category, item_id: item.id, item_name: item.name, price: item.price, phone: phone.trim(), deadline: deadline.trim() }
      : { type: "buyurtma_erkin", group: context.group, group_name: GROUP_INFO[context.group].name, category: context.category, text: text.trim(), phone: phone.trim(), deadline: deadline.trim() };

    try {
      const res = await fetch(BACKEND_ORDER_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...payload, init_data: tg ? tg.initData : null }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) { haptic('success'); onSubmitted(true); }
      else { haptic('error'); onSubmitted(false, data.error); }
    } catch (e) {
      haptic('error'); onSubmitted(false, 'network');
    }
    setSending(false);
  };

  return (
    <Sheet onClose={onClose}>
      <div style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--orange)", fontSize: 11.5, fontWeight: 700, marginBottom: 10 }}>
        🛒 BUYURTMA BERISH
      </div>
      <div style={{ fontFamily: "var(--font-head)", fontSize: 17, fontWeight: 700, marginBottom: 4 }}>
        {item ? item.name : "Boshqa material"}
      </div>
      {item && <div style={{ color: "var(--blue)", fontWeight: 800, fontSize: 14, marginBottom: 14 }}>{fmtPrice(item.price)}</div>}
      {!item && (
        <div style={{ marginBottom: 14 }}>
          <label style={labelStyle()}>Nima kerak</label>
          <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Masalan: O'zbekiston xaritasi, A2 formatda, bosma" style={{ ...inputStyle(), minHeight: 80, resize: "vertical" }} />
        </div>
      )}
      <label style={labelStyle()}>Telefon raqamingiz</label>
      <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+998 90 123 45 67" inputMode="tel" style={inputStyle()} />
      <label style={labelStyle()}>Qachongacha kerak (ixtiyoriy)</label>
      <input value={deadline} onChange={(e) => setDeadline(e.target.value)} placeholder="Masalan: shu hafta ichida" style={inputStyle()} />
      {errorMsg && <div style={{ color: "var(--pink)", fontSize: 12.5, fontWeight: 700, marginBottom: 10 }}>{errorMsg}</div>}
      <div style={{ display: "flex", gap: 10, marginTop: 6 }}>
        <button onClick={onClose} style={{ flex: 1, background: "var(--card-muted)", border: "none", color: "var(--ink)", borderRadius: 12, padding: 13, fontWeight: 700, fontSize: 14 }}>Bekor qilish</button>
        <button onClick={submit} disabled={sending} style={{ flex: 2, background: "var(--blue)", color: "#fff", border: "none", borderRadius: 12, padding: 13, fontWeight: 700, fontSize: 14, opacity: sending ? 0.7 : 1 }}>
          {sending ? "Yuborilmoqda..." : "Yuborish"}
        </button>
      </div>
    </Sheet>
  );
}

function labelStyle(){ return { display: "block", fontSize: 11.5, fontWeight: 700, color: "var(--ink-soft)", textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 6 }; }
function inputStyle(){ return { width: "100%", padding: "12px 14px", borderRadius: 11, border: "1px solid var(--border)", background: "var(--bg)", color: "var(--ink)", fontSize: 14, marginBottom: 14 }; }

          <div style={{ fontFamily: "var(--font-head)", fontWeight: 700, fontSize: 16, marginBottom: 6 }}>Savolingiz qabul qilindi</div>
          <div style={{ fontSize: 13, color: "var(--ink-soft)" }}>Metodist tez orada javob beradi. Bu xizmat har doim bepul.</div>

      ) : (
        <>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>

            <div>

// ---------- Home Screen ----------

    <div className="fade">
      <TopBar themeMode={themeMode} onToggleTheme={onToggleTheme} />

        </button>

function quickPillStyle(){

}

// ---------- Group Screen ----------
function GroupScreen({ group, nav, themeMode, onToggleTheme }) {
  const info = GROUP_INFO[group];
  return (
    <div className="fade">
      <TopBar onBack={() => nav.pop()} title={info.name} sub="Bo'limni tanlang" themeMode={themeMode} onToggleTheme={onToggleTheme} />
      <div style={{ padding: "10px 20px 0" }}>
        <a href={info.link} target="_blank" rel="noopener" style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: "var(--ink)", color: "var(--bg)", border: "none", padding: "14px 18px", borderRadius: 13, fontWeight: 700, fontSize: 14.5, marginBottom: 18 }}>
          Kanalga o'tish →
        </a>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {CATEGORIES.map((cat) => {
            const count = CATALOG.filter((it) => it.groups.includes(group) && it.category === cat.id).length;
            return (
              <button key={cat.id} onClick={() => { haptic('light'); nav.push({ screen: "category", group, category: cat.id }); }}

                <div style={{ width: 44, height: 44, borderRadius: 12, background: info.soft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>{cat.icon}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: "var(--font-head)", fontWeight: 700, fontSize: 15.5, marginBottom: 2 }}>{cat.name}</div>
                  <div style={{ fontSize: 12, color: "var(--ink-soft)", fontWeight: 600 }}>{count} ta material</div>
                </div>
                <span style={{ opacity: 0.4 }}>›</span>
              </button>

      </div>
      <div style={{ textAlign: "center", padding: "26px 20px 0", fontSize: 11, color: "var(--ink-faint)" }}>Bog'cha hujjatlari · Ichki portal</div>
    </div>
  );
}

// ---------- Category Screen ----------
function CategoryScreen({ group, category, nav, themeMode, onToggleTheme, onOrder }) {
  const [query, setQuery] = useState("");
  const info = GROUP_INFO[group];
  const cat = CATEGORIES.find((c) => c.id === category);
  let items = CATALOG.filter((it) => it.groups.includes(group) && it.category === category);
  if (query.trim()) {
    const q = query.trim().toLowerCase();
    items = items.filter((it) => it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q));
  }

  return (
    <div className="fade">
      <TopBar onBack={() => nav.pop()} title={cat.name} sub={info.name} themeMode={themeMode} onToggleTheme={onToggleTheme} />
      <div style={{ padding: "10px 20px 0" }}>
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Qidirish..." style={{ ...inputStyle(), marginBottom: 6 }} />

        {items.length === 0 && (
          <div style={{ textAlign: "center", padding: "24px 16px", color: "var(--ink-soft)", fontSize: 13 }}>
            Bu bo'limda hali material yo'q. Pastdagi tugma orqali buyurtma bering.
          </div>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {items.map((it) => (
            <div key={it.id} style={{ background: "var(--card)", border: "1px solid var(--border)", borderRadius: 15, padding: 14, boxShadow: "var(--shadow)" }}>
              <div style={{ display: "flex", gap: 12, marginBottom: 10 }}>
                <div style={{ width: 60, height: 60, borderRadius: 11, background: info.soft, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, flexShrink: 0, overflow: "hidden" }}>
                  {it.image ? <img src={it.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={(e) => { e.target.style.display = "none"; }} /> : "🖼️"}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: "var(--font-head)", fontWeight: 700, fontSize: 14.5, marginBottom: 3 }}>{it.name}</div>
                  <div style={{ fontWeight: 800, fontSize: 13, color: "var(--blue)", marginBottom: 3 }}>{fmtPrice(it.price)}</div>
                  <div style={{ fontSize: 12, color: "var(--ink-soft)", lineHeight: 1.4 }}>{it.desc}</div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                {it.telegram_link
                  ? <a href={it.telegram_link} target="_blank" rel="noopener" style={{ flex: 1, textAlign: "center", background: "var(--bg)", border: "1px solid var(--border)", borderRadius: 9, padding: "9px 10px", fontSize: 12, fontWeight: 700, color: "var(--ink)" }}>To'liq ko'rish →</a>
                  : <span style={{ flex: 1, textAlign: "center", padding: "9px 10px", fontSize: 12, fontWeight: 700, color: "var(--ink-faint)" }}>Havola yo'q</span>}
                <button onClick={() => { haptic('light'); onOrder({ group, category, item: it }); }} style={{ flex: 1, textAlign: "center", background: "var(--blue)", border: "none", borderRadius: 9, padding: "9px 10px", fontSize: 12, fontWeight: 800, color: "#fff" }}>🛒 Buyurtma qilish</button>
              </div>
            </div>
          ))}
        </div>

        <button onClick={() => { haptic('light'); onOrder({ group, category, item: null }); }}
          style={{ width: "100%", marginTop: 14, background: "var(--card)", border: "2px dashed var(--border)", color: "var(--ink)", padding: "14px 18px", borderRadius: 13, fontWeight: 700, fontSize: 14 }}>
          🛒 Boshqa narsa kerak — buyurtma berish
        </button>
      </div>
      <div style={{ textAlign: "center", padding: "26px 20px 0", fontSize: 11, color: "var(--ink-faint)" }}>Bog'cha hujjatlari · Ichki portal</div>
    </div>
  );
}

// ---------- App Root ----------
function App() {
  const [stack, setStack] = useState([{ screen: "home" }]);
  const [themeMode, setThemeMode] = useState(tg && tg.colorScheme === "dark" ? "dark" : "light");
  const [orderCtx, setOrderCtx] = useState(null);
  const [consultOpen, setConsultOpen] = useState(false);
  const [supportOpen, setSupportOpen] = useState(false);
  const [toast, setToast] = useState("");

  useEffect(() => {
    document.documentElement.classList.toggle("dark", themeMode === "dark");
  }, [themeMode]);

  const nav = {
    push: (s) => setStack((st) => [...st, s]),
    pop: () => setStack((st) => (st.length > 1 ? st.slice(0, -1) : st)),
  };
  const current = stack[stack.length - 1];
  const toggleTheme = () => setThemeMode((m) => (m === "dark" ? "light" : "dark"));

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2600); };

  const handleOrderSubmitted = (ok, errorCode) => {
    setOrderCtx(null);
    showToast(ok ? "Buyurtma yuborildi ✓" : ("Xatolik yuz berdi (" + (errorCode || "noma'lum") + ") — qayta urinib ko'ring"));
  };

  return (
    <div className="wrap">
      {current.screen === "home" && (
        <HomeScreen nav={nav} themeMode={themeMode} onToggleTheme={toggleTheme} onConsult={() => setConsultOpen(true)} onSupport={() => setSupportOpen(true)} />
      )}
      {current.screen === "group" && (
        <GroupScreen group={current.group} nav={nav} themeMode={themeMode} onToggleTheme={toggleTheme} />
      )}
      {current.screen === "category" && (
        <CategoryScreen group={current.group} category={current.category} nav={nav} themeMode={themeMode} onToggleTheme={toggleTheme} onOrder={setOrderCtx} />
      )}

      {orderCtx && <OrderModal context={orderCtx} onClose={() => setOrderCtx(null)} onSubmitted={handleOrderSubmitted} />}
      {consultOpen && <ConsultModal onClose={() => setConsultOpen(false)} />}
      {supportOpen && <SupportModal onClose={() => setSupportOpen(false)} />}
      <Toast text={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
